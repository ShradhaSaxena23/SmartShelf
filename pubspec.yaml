name: smart_shelf
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI & Utilities
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  intl: ^0.19.0
  image_picker: ^1.1.2
  geolocator: ^13.0.0
  http: ^1.2.0
  url_launcher: ^6.3.0

  # Firebase Core & App Check
  firebase_core: ^4.13.0
  firebase_app_check: ^0.4.5+1
  # Firebase AI Client (Google AI backend)
  firebase_ai: ^3.14.0
  cloud_firestore: ^6.8.0
  firebase_auth: ^6.5.7
  fl_chart: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/